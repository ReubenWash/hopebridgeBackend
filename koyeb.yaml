# koyeb.yaml
service:
  name: hopebridge-backend
  env:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: "8000"
  ports:
    - port: 8000
      protocol: http
  health_check:
    path: /health
    interval: 30s
    timeout: 5s
    healthy_threshold: 1
    unhealthy_threshold: 3